# Sistemas · Claude programa lo que Daniela aprobó en la Oficina.
# oficina-sistemas abre un issue con la etiqueta «sistemas» cuando Daniela aprueba un pedido de código; Claude lo toma,
# escribe el cambio en una rama y deja el link para abrir el PR. Nada llega a master sin que Daniela apruebe el PR.
# Para seguir la charla en el mismo issue, Daniela comenta con @claude.
# Requiere el secreto ANTHROPIC_API_KEY en el repositorio y la app de Claude instalada en GitHub.
name: Sistemas · Claude programa

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

concurrency:
  group: sistemas-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  programar:
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'sistemas') ||
      (github.event_name == 'issue_comment' && !github.event.issue.pull_request &&
       contains(github.event.comment.body, '@claude') &&
       contains(github.event.issue.labels.*.name, 'sistemas') &&
       github.event.comment.author_association == 'OWNER')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          label_trigger: sistemas
          claude_args: --max-turns 60
