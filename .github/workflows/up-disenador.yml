name: UP · Diseñador

# Arma las placas de los carruseles de UP. Cada 15 minutos pregunta a la Edge Function up-disenador si hay
# carruseles con texto nuevo; solo si hay, instala Chromium, renderiza y sube las placas.
on:
  schedule:
    - cron: '7-59/15 * * * *'
  workflow_dispatch:

concurrency:
  group: up-disenador
  cancel-in-progress: false

jobs:
  disenar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UP_DISENADOR_SECRETO: ${{ secrets.UP_DISENADOR_SECRETO }}
    steps:
      - name: Buscar carruseles para armar
        id: pendientes
        run: |
          if [ -z "$UP_DISENADOR_SECRETO" ]; then
            echo "::warning::Falta el secret UP_DISENADOR_SECRETO; el diseñador no puede correr."
            echo "cantidad=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          n=$(curl -sSf -H "apikey: sb_publishable_jK_ebdVy29E9sKQA4sd3Qw_X4YJJ4Qu" -H "x-trabajador-secreto: $UP_DISENADOR_SECRETO" \
            https://itultpcdafpxpgtblgfb.supabase.co/functions/v1/up-disenador | jq '.piezas | length')
          echo "$n carrusel(es) para armar."
          echo "cantidad=$n" >> "$GITHUB_OUTPUT"
      - if: steps.pendientes.outputs.cantidad != '0'
        uses: actions/checkout@v4
      - if: steps.pendientes.outputs.cantidad != '0'
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - if: steps.pendientes.outputs.cantidad != '0'
        working-directory: scripts/up-disenador
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - if: steps.pendientes.outputs.cantidad != '0'
        run: node scripts/up-disenador/disenar.mjs
